# Compilation du firmware et de la page web, tests sur ordinateur, fichiers de découpe à jour, licences (REUSE).
# Le job firmware compile un dépôt propre: la version affichée est celle du commit (sans -dirty).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: make firmware
      - run: make webfs
      - run: make test-native

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/app.js && node --check scripts/mock-server.mjs
      - run: make test-scripts
      - run: make test-cad
      - run: make check-cad

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
