[platformio]
; pio run / upload / uploadfs ciblent la boîte; les tests sur ordinateur passent par l'environnement native.
default_envs = totobox-s3

[env:totobox-s3]
; Versions figées: le code dépend du comportement exact d'ESP32-audioI2S 2.3.0 (voir AGENTS.md, « Pièges connus »).
; Monter une version = recompiler, retester sur la boîte (lecture, reprise, retrait de carte SD) et mettre à jour ici.
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; Version du firmware (commit compilé), puis image LittleFS: page de web/ assemblée en un fichier et compressée
extra_scripts =
  pre:scripts/build_version.py
  pre:scripts/build_webfs.py
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  -Wno-attributes
  -Wno-deprecated-declarations
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  adafruit/Adafruit PN532 @ 1.3.4
  esphome/ESP32-audioI2S @ 2.3.0

[env:native]
; Tests unitaires sur l'ordinateur: pio test -e native
; Seuls les modules sans matériel sont compilés; test/support remplace Arduino, la NVS, l'aléa et mbedtls.
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<id3_stripper.cpp> +<access_lock.cpp> +<config_store.cpp> +<network_names.cpp> +<factory_data.cpp> +<card_backup.cpp> +<request_guard.cpp>
build_flags =
  -std=gnu++17
  -Itest/support
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
